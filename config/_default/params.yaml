# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance

# appearance:
#   theme_day: minimal
#   theme_night: minimal
#   font: Native
#   font_size: m
#   color: GREEN

appearance:
  theme_default: light
  mode: system
  color: blue
  font_size: l


# SEO

marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'A blog about dev stuff.'
    twitter: 'riadNassiffe'
  analytics:
    google_tag_manager: ' GTM-5PDJ924'
    baidu_tongji: ''
    #google_tag_manager: ''
    microsoft_clarity: ''
  verification:
    # google: ''
    baidu: ''

# Site header

header:
  navbar:
    enable: true
    # Align menu links: `left`, `center`, or `right`
    align: center
    show_logo: true
    show_language: true
    show_day_night: true
    show_search: true
    highlight_active_link: true
    # Choose a built-in navigation blox or create your own
    blox: "navbar"
    # Fix the navigation bar to the top of the page
    fixed_to_top: true
    logo:
      # Logo text
      text: "Ríad Nassiffe"
      # Logo filename in `assets/media/` folder
      #filename: "avatar.jpg"
    # button:
    #   enable: true
    #   text: "Get Started"
    #   url: "https://hugoblox.com/templates/"
    # Let the user choose between light or dark mode?
    show_theme_chooser: true
    # Let the user search from the navigation bar?
    # Show a language chooser (if you have translated your site content)?
    show_translations: true
    # If `show_translations` is enabled, do you wish to hide the current language name?
    hide_language_name: false


locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  syntax_highlighter:
    theme_light: github-light
    theme_dark: dracula
  math:
    enable: true
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/<username>/<repository>'
    content_dir: content
    branch: main
  avatar:
    gravatar: true
    shape: circle
  comment:
    provider: 'giscus'
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: 'riadnassiffe/riadnassiffe.github.io'
      repo_id: 'MDEwOlJlcG9zaXRvcnkzNDkxNTU2ODA='
      category: 'Announcements'
      category_id: 'IC_kwDOFM-xYM4CglyJ'
      theme: preferred_color_scheme
      language_code: en
      mapping: pathname
  map:
    provider: 'mapnik'
    api_key: ''
    zoom: 15

# Extensions

extensions:
  cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

# Security

# security:
#   # Allow frame for embedding speaker notes in slides
#   allow_frame: true

# Site header
# header:
#   navbar:
#     enable: true
#     blox: "navbar"
#     fixed_to_top: true
#     show_search: true
#     show_theme_chooser: true
#     logo:
#       text: "Ríad Nassiffe"

# Site footer
footer:
  copyright:
    notice: '© {year} Me. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

page:
  show_date: true
  reading_time: false
  share: true