# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: indigo

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'A blog about dev stuff.'
    twitter: 'riadNassiffe'
  analytics:
    google_tag_manager: 'GTM-5PDJ924'
    google_analytics: 'G-5R1VVRQKBT'
    # microsoft_clarity: ''
  verification:
    # google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    block: 'navbar'
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: 'Ríad M. Nassiffe'

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  syntax_highlighter:
    theme_light: github-light
    theme_dark: dracula
  math:
    enable: true
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/<username>/<repository>'
    content_dir: content
    branch: main
  avatar:
    gravatar: true
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: 'riadnassiffe/riadnassiffe.github.io'
      repo_id: 'MDEwOlJlcG9zaXRvcnkzNDkxNTU2ODA='
      category: 'Announcements'
      category_id: 'IC_kwDOFM-xYM4CglyJ'
      theme: preferred_color_scheme
      language_code: en
      mapping: pathname
  map:
    provider: 'mapnik'
    api_key: ''
    zoom: 15
  diagram:
    enable: true

# Extensions

extensions:
  cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

# Site footer
footer:
  copyright:
    notice: '© {year} Me. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

page:
  show_date: true
  reading_time: false
  share: true
